# Mỗi pull request và mỗi lần gộp vào main (mục 20 yêu cầu v0.1):
# - audit: quét lỗ hổng thư viện. Tách riêng để một lỗ hổng chưa có bản vá không chặn các bước kiểm khác.
#   Job này có thể đỏ trong lúc chờ bản vá (xem TRANG-THAI.md); khoá main KHÔNG bắt buộc job này.
# - check: kiểm kiểu, lint, test tích hợp, build, quét bí mật. Khoá main bắt buộc job này xanh.
# - e2e: test giao diện, chạy sau khi check đạt.
# Chưa có bước build ảnh Docker hay triển khai tự động.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: renco
          POSTGRES_PASSWORD: renco_ci
          POSTGRES_DB: renco_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U renco" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://renco:renco_ci@localhost:5432/renco_test
      TEST_DATABASE_URL: postgres://renco:renco_ci@localhost:5432/renco_test
      PAYLOAD_SECRET: ci-secret-0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      TOTP_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks cần lịch sử commit để quét
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:int
      - run: pnpm build
      - name: Quét bí mật
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: renco
          POSTGRES_PASSWORD: renco_ci
          POSTGRES_DB: renco
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U renco" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://renco:renco_ci@localhost:5432/renco
      PAYLOAD_SECRET: ci-secret-0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_PASSWORD: Ci-only-password-123
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm seed
      - run: pnpm test:e2e
